name: Update Packages' Sources

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 1 * *"

permissions:
  contents: read

jobs:
  update-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Get Github App info
        id: app_auth
        uses: pedorich-n/github-workflows/.github/actions/app-token@58548fbbf0d64500d5d3dd8adfe95ab60dca44fb # main
        with:
          client_id: ${{ vars.APP_CLIENT_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Setup job
        uses: pedorich-n/github-workflows/.github/actions/setup-nix-job@58548fbbf0d64500d5d3dd8adfe95ab60dca44fb # main

      - name: Run nix-update
        id: nix_update
        uses: pedorich-n/github-workflows/.github/actions/nix-update@58548fbbf0d64500d5d3dd8adfe95ab60dca44fb # main
        with:
          packages: playit

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Changes detected"
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes detected"
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and open PR
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app_auth.outputs.token }}
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          commit-message: "Updated playit package using nix-update"
          branch: "nix-update/${{ github.run_id }}"
          title: "Update playit package using nix-update"
          body: ${{ steps.nix_update.outputs.summary }}
